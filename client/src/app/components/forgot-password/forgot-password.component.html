<div class="auth-wrapper" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
  <div class="glass-panel" style="width: 100%; max-width: 440px; padding: 2.5rem; border-radius: var(--border-radius-lg); position: relative; box-shadow: var(--glass-shadow);">
    
    <!-- Branding Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); margin-bottom: 1.25rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
        </svg>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; background: var(--title-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Reset Password</h2>
      <p style="font-size: 0.875rem; color: var(--text-secondary);" *ngIf="step === 1">Enter your registered email to receive an OTP</p>
      <p style="font-size: 0.875rem; color: var(--text-secondary);" *ngIf="step === 2">Enter the OTP code and your new password</p>
    </div>

    <!-- Error Message Banner -->
    <div *ngIf="errorMessage" class="badge-error" style="padding: 0.75rem 1rem; border-radius: var(--border-radius-sm); font-size: 0.85rem; font-weight: 500; margin-bottom: 1.5rem; text-align: center;">
      {{ errorMessage }}
    </div>

    <!-- STEP 1: Request OTP -->
    <form *ngIf="step === 1" (submit)="requestResetOtp($event)">
      <div class="form-group" style="margin-bottom: 2rem;">
        <label class="form-label" for="email">Work Email</label>
        <input class="form-input" type="email" id="email" [(ngModel)]="email" name="email" placeholder="name@company.com" required>
      </div>

      <button class="btn btn-primary" type="submit" style="width: 100%; height: 48px;" [disabled]="loading">
        <span *ngIf="!loading">Send Reset Code</span>
        <span *ngIf="loading">Sending Code...</span>
      </button>
    </form>

    <!-- STEP 2: Reset Password with OTP -->
    <form *ngIf="step === 2" (submit)="resetPassword($event)">
      <div class="form-group">
        <label class="form-label" for="emailReadOnly">Work Email</label>
        <input class="form-input" type="email" id="emailReadOnly" [value]="email" readonly style="opacity: 0.7;">
      </div>

      <div class="form-group">
        <label class="form-label" for="otpCode">6-Digit Reset OTP Code</label>
        <input class="form-input" type="text" id="otpCode" [(ngModel)]="otpCode" name="otpCode" placeholder="123456" maxlength="6" required style="font-size: 1.25rem; letter-spacing: 4px; text-align: center; font-weight: 700;">
      </div>

      <div class="form-group">
        <label class="form-label" for="newPassword">New Password</label>
        <input class="form-input" type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword" placeholder="••••••••" required>
      </div>

      <div class="form-group" style="margin-bottom: 2rem;">
        <label class="form-label" for="confirmPassword">Confirm New Password</label>
        <input class="form-input" type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
      </div>

      <button class="btn btn-primary" type="submit" style="width: 100%; height: 48px;" [disabled]="loading">
        <span *ngIf="!loading">Reset Password</span>
        <span *ngIf="loading">Updating Password...</span>
      </button>
    </form>

    <!-- Back to Login Link -->
    <div style="text-align: center; margin-top: 2rem; font-size: 0.875rem;">
      <a routerLink="/login" style="color: var(--accent-violet); font-weight: 600; text-decoration: none;">&larr; Back to Sign In</a>
    </div>

  </div>
</div>
