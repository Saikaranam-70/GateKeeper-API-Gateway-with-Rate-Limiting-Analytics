<div class="auth-wrapper" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
  <div class="glass-panel" style="width: 100%; max-width: 440px; padding: 2.5rem; border-radius: var(--border-radius-lg); position: relative; box-shadow: var(--glass-shadow);">
    
    <!-- Branding Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="logo.jpg" alt="GateKeeper Logo" style="width: 64px; height: 64px; border-radius: var(--border-radius-md); object-fit: cover; margin-bottom: 1.25rem; box-shadow: var(--glow-shadow-violet); border: 1px solid rgba(99, 102, 241, 0.3);">
      <h2 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; background: var(--title-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">GateKeeper</h2>
      <p style="font-size: 0.875rem; color: var(--text-secondary);">Control Plane & API Gateway Console</p>
    </div>

    <!-- Error Message Banner -->
    <div *ngIf="errorMessage" class="badge-error" style="padding: 0.75rem 1rem; border-radius: var(--border-radius-sm); font-size: 0.85rem; font-weight: 500; margin-bottom: 1.5rem; text-align: center;">
      {{ errorMessage }}
    </div>

    <!-- Form -->
    <form (submit)="onSubmit($event)">
      <div class="form-group">
        <label class="form-label" for="email">Work Email</label>
        <input class="form-input" type="email" id="email" [(ngModel)]="email" name="email" placeholder="name@company.com" required>
      </div>

      <div class="form-group" style="margin-bottom: 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
          <a routerLink="/forgot-password" style="font-size: 0.8rem; color: var(--accent-violet); text-decoration: none; font-weight: 500;">Forgot Password?</a>
        </div>
        <input class="form-input" type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••" required style="margin-top: 0.5rem;">
      </div>

      <button class="btn btn-primary" type="submit" style="width: 100%; height: 48px; margin-top: 1rem;" [disabled]="loading">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Authenticating...</span>
      </button>
    </form>

    <!-- Sign up trigger link -->
    <div style="text-align: center; margin-top: 2rem; font-size: 0.875rem; color: var(--text-secondary);">
      New to GateKeeper? 
      <a routerLink="/register" style="color: var(--accent-violet); font-weight: 600; text-decoration: none; transition: var(--transition-smooth); margin-left: 0.25rem;">Create Account</a>
    </div>

  </div>
</div>
